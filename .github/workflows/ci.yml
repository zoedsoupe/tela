name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  backend:
    name: Elixir 1.20.5 / OTP 29.1.2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: beam
        uses: erlef/setup-beam@v1
        with:
          otp-version: '29.1.2'
          elixir-version: '1.20.5'
          version-type: strict

      - name: Install the C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes build-essential

      - name: Install Hex and Rebar
        run: mix local.hex --force && mix local.rebar --force

      - name: Cache Mix dependencies and builds
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-beam${{ steps.beam.outputs.setup-beam-version }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp${{ steps.beam.outputs.otp-version }}-elixir${{ steps.beam.outputs.elixir-version }}-beam${{ steps.beam.outputs.setup-beam-version }}-

      - name: Fetch dependencies
        run: mix deps.get

      - name: Run precommit
        run: mix precommit

  frontend:
    name: React SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Typecheck
        run: npm --prefix frontend run typecheck

      - name: Lint
        run: npm --prefix frontend run lint

      - name: Test
        run: npm --prefix frontend test

      - name: Build
        run: npm --prefix frontend run build

  image:
    name: Build multi-arch image
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Check release scripts
        run: sh -n docker/entrypoint.sh docker/healthcheck.sh

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=match,pattern=v(.*),group=1,value=${{ github.ref_name }}
            type=sha,format=long

      - name: Log in to GHCR on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image and publish version tags
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
